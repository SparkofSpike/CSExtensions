#The following ones like damage, reload, spread, are all for Crackshot weapons,
#The first parameter is the condition, the second is the coefficient, and the third is the operator.
#The condition can use the AND, OR, and NOT algorithms.
#However, it should be noted that due to the limitations of YAML files, bugs may sometimes occur.
#It's because "!" and "&" are regarded as reserved characters in YAML, rather than our operator.
#Wrapping the entire expression with parentheses will solve the problem. See the example.
#The available operators are ADD, MUL, FIX, and actually there's also FLAT.
#But I don't recommend you use it because I haven't tested it myself.
#Next, the health_adjustment and weight module... Just write the numbers.
#The value of health_adjustment determines how much the player's maximum health will increase.
#You can also write a negative number to deduct from the maximum value.
#Noted that the player's health cannot be lower than 0. Relevant mechanism has been included.
#When the weight is 1, the players unable to move as their movement speed is reduced by 100%.
#On the contrary, when -1, the players will run extremely fast as the speed is increased by 100%.
#You might be wondering why it can't be configured as flexibly as the others...
