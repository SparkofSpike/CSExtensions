#How can you use it? Just use it as you're using MythicMobs.
#Format: - SkillName Targeter Trigger Condition
#Targeters Available: @Shooter/@Self,@Victim,@Trigger,@Hitlocation
#Triggers Available: ~ontimer:x,ondamaged,onattack,onshoot,oncrit,onheadshot,onreload,onhitblock
#Conditions Available: ……Eh, in fact, it only supports the above tag conditions.
#It should be noted that MM skills triggered by CSE will ignore all built-in conditions.
#So if you want to retain the built-in conditions of the MM skill, you should do it like this:
