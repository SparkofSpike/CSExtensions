accessories:
  attack_ring:
    name: '&6攻击戒指'
    material: GOLD_NUGGET
    data: 0
    lore:
      - 'L1'
      - 'L2'
    damage:
      - (!(Fire||Ice)&&Magic) 10 add
      - all 1.5 mul
    reload:
      - fire 1 add
      - all 1.5 mul
    spread:
      - fire 1 add
      - all 1.5 mul
    health_adjustment: 100
    weight: -1
    armor: false
    mythic:
      - KickYourAss @self ~onAttack (TrueMelee||Fire)